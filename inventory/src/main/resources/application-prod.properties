# ============================================
# PRODUCTION CONFIGURATION
# ============================================
# Use: java -jar app.jar --spring.profiles.active=prod
# Or set environment variable: SPRING_PROFILES_ACTIVE=prod

spring.application.name=inventory

# Database - Use environment variables in production
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration - NEVER use ddl-auto=update in production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JWT Security - Use strong secret in production (min 256 bits)
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS - Configure your production domain(s)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourdomain.com}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allow-credentials=true

# Logging - Less verbose in production
logging.level.root=WARN
logging.level.com.joaco.inventory=INFO
logging.level.org.springframework.security=WARN

# Disable debug endpoints
spring.devtools.add-properties=false

